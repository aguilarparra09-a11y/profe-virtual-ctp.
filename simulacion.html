<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Misión Oficina Secretarial — Profe Virtual CTP</title><style>body{font:16px system-ui,Arial;background:#f2f6fc;color:#18253c;margin:0}header{background:linear-gradient(110deg,#173b79,#128477);color:white;padding:22px}main{max-width:950px;margin:22px auto;padding:0 15px}.panel{background:white;border-radius:14px;padding:20px;margin:14px 0;box-shadow:0 3px 12px #0001}button,select,input{font:inherit;padding:12px;border-radius:9px;border:1px solid #b7c9df}button{background:#245da6;color:white;cursor:pointer;margin:4px}button:disabled{opacity:.55}.choice{display:block;width:100%;text-align:left;background:#eaf3ff;color:#173b79}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.tile{background:#eaf3ff;color:#173b79;min-height:70px}.hidden{display:none}.feedback{font-weight:bold;padding:10px}.good{color:#13794c}.bad{color:#a23636}a{color:#174c91}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}label{display:block;margin:8px 0}#board{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;max-width:480px}#board button{padding:7px 0;margin:0;background:#eaf3ff;color:#173b79;font-weight:bold;min-width:0}#board button.selected{background:#ffd778}#board button.found{background:#9be2b8}small{color:#51657b}@media(max-width:600px){header{padding:16px}.panel{padding:15px}#board button{font-size:12px;padding:5px 0}}</style></head><body><header><h1>🏢 Misión: Oficina Secretarial</h1><p>CTP Puntarenas · Taller de Oficina Secretarial · Sétimo año</p></header><main><p><a href="index.html">← Volver al aula virtual</a></p><section class="panel"><p>Resuelva situaciones prácticas relacionadas con los contenidos existentes de Profe Virtual CTP. Esta actividad es complementaria.</p><label>Nombre <input id="name" maxlength="70"></label><label>Sección <input id="section" maxlength="20"></label><button onclick="start()">Iniciar misión</button></section><section class="panel hidden" id="game"><h2 id="title"></h2><div id="stage"></div><p id="feedback" aria-live="polite"></p></section><script>
const cases=[{q:'Recibe un correo que solicita la contraseña institucional. ¿Qué hace?',opts:['Compartir la contraseña','Verificar el mensaje y avisar a la persona responsable','Abrir todos los enlaces'],a:1},{q:'Una oficina necesita reducir el gasto energético. ¿Qué opción considera?',opts:['Iluminación inteligente controlada por sensores','Mantener las luces encendidas siempre','No evaluar el consumo'],a:0},{q:'Una persona consulta el horario de atención. ¿Qué herramienta puede apoyar?',opts:['Chatbot para preguntas frecuentes con supervisión humana','Compartir información privada','Eliminar la atención humana'],a:0},{q:'Un compañero trabaja con mala postura. ¿Qué recomienda?',opts:['Mantener el cuello inclinado','Ajustar silla y pantalla y realizar pausas activas','Evitar descansos'],a:1}];let i=0,correct=0;const e=id=>document.getElementById(id);function start(){i=0;correct=0;e('game').classList.remove('hidden');show()}function show(){e('stage').innerHTML='';if(i>=cases.length){e('title').textContent='Misión terminada';e('stage').textContent=`Aciertos: ${correct}/${cases.length}`;let all=JSON.parse(localStorage.getItem('ctp_mission_v1')||'[]');all.push({name:e('name').value.trim()||'Sin nombre',section:e('section').value.trim()||'Sin sección',score:Math.round(correct/cases.length*100),date:new Date().toLocaleString('es-CR')});localStorage.setItem('ctp_mission_v1',JSON.stringify(all));return}let c=cases[i];e('title').textContent=`Caso ${i+1} de ${cases.length}`;let p=document.createElement('p');p.textContent=c.q;e('stage').append(p);c.opts.forEach((o,j)=>{let b=document.createElement('button');b.textContent=o;b.style.display='block';b.style.width='100%';b.style.textAlign='left';b.onclick=()=>{if(j===c.a)correct++;e('feedback').textContent=j===c.a?'¡Correcto!':'Respuesta correcta: '+c.opts[c.a];e('stage').querySelectorAll('button').forEach(x=>x.disabled=true);let n=document.createElement('button');n.textContent='Continuar';n.onclick=()=>{i++;e('feedback').textContent='';show()};e('stage').append(n)};e('stage').append(b)})}
</script></main></body></html>
